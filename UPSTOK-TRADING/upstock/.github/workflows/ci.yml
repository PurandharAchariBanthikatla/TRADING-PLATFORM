name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend / lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend-checks:
    name: Backend / lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U exchange"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7.4.1-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_test
      JWT_SECRET_KEY: ci-only-secret-not-for-real-use
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app
      - name: Pytest (unit + integration against real Postgres/Redis)
        run: pytest --cov=app --cov-report=term-missing
      - name: Alembic migration check (upgrade head must succeed cleanly)
        run: |
          export DATABASE_URL="$TEST_DATABASE_URL"
          alembic upgrade head
          alembic downgrade base

  ledger-service-checks:
    name: Ledger service / lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-service
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange_ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U exchange"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_ledger_test
      DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_ledger_test
      # Must match api-gateway's CI secret above -- this service only
      # verifies tokens api-gateway would have issued with the same key.
      JWT_SECRET_KEY: ci-only-secret-not-for-real-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ledger-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app
      - name: Pytest (accounting invariants, concurrency, RBAC -- against real Postgres)
        run: pytest --cov=app --cov-report=term-missing
      - name: Alembic migration check (upgrade head must succeed cleanly)
        run: |
          alembic upgrade head
          alembic downgrade base

  wallet-service-checks:
    name: Wallet service / lint, typecheck, tests (against a live ledger-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wallet-service
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange_wallet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U exchange"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_wallet_test
      DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_wallet_test
      JWT_SECRET_KEY: ci-only-secret-not-for-real-use
      INTERNAL_SERVICE_KEY: ci-only-internal-key-not-for-real-use
      LEDGER_SERVICE_BASE_URL: http://localhost:8010/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/wallet-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app
      - name: Alembic migration check (upgrade head must succeed cleanly)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Start a real ledger-service instance for integration testing
        working-directory: services/ledger-service
        env:
          DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_ledger_ci
          JWT_SECRET_KEY: ci-only-secret-not-for-real-use
          INTERNAL_SERVICE_KEY: ci-only-internal-key-not-for-real-use
        run: |
          PGPASSWORD=exchange psql -h localhost -U exchange -d exchange_wallet_test \
            -c "SELECT 1" >/dev/null  # sanity: postgres service is reachable before creating a second db
          PGPASSWORD=exchange createdb -h localhost -U exchange exchange_ledger_ci
          pip install -r requirements-dev.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8010 > /tmp/ledger-ci.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8010/health/ready && break
            sleep 1
          done
          curl -sf http://localhost:8010/health/ready || (cat /tmp/ledger-ci.log && exit 1)
      - name: Pytest (deposits, withdrawals, transfers, limits, RBAC, concurrency -- against the live ledger-service above)
        run: pytest --cov=app --cov-report=term-missing
      - name: Dump ledger-service log on failure
        if: failure()
        run: cat /tmp/ledger-ci.log || true

  market-data-service-checks:
    name: Market-data service / lint, typecheck, tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-data-service
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange_marketdata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U exchange"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7.4.1-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_marketdata_test
      DATABASE_URL: postgresql+asyncpg://exchange:exchange@localhost:5432/exchange_marketdata_test
      TEST_REDIS_URL: redis://localhost:6379/2
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-secret-not-for-real-use
      INTERNAL_SERVICE_KEY: ci-only-internal-key-not-for-real-use
      # Tests drive the simulator/aggregator directly and assert on exact
      # counts/sequences; a background loop racing those same tables would
      # make results nondeterministic, so the always-on producer/consumer
      # loops are disabled for the test run itself (see the separate "live
      # smoke test" step below, which exercises them for real).
      SIMULATOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/market-data-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app
      - name: Alembic migration check (upgrade head must succeed cleanly)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest (precision, idempotent candle aggregation, event-bus retry/DLQ, simulator determinism, API)
        run: pytest --cov=app --cov-report=term-missing
      - name: Live smoke test (real background simulator + candle aggregator, end to end)
        env:
          SIMULATOR_ENABLED: "true"
          SIMULATOR_TICK_INTERVAL_SECONDS: "0.2"
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8030 > /tmp/marketdata-ci.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8030/health/ready && break
            sleep 1
          done
          curl -sf http://localhost:8030/health/ready || (cat /tmp/marketdata-ci.log && exit 1)

          TOKEN=$(python -c "
          from jose import jwt
          from datetime import datetime, timedelta, UTC
          import uuid
          payload = {'sub': str(uuid.uuid4()), 'type': 'access', 'role': 'admin',
                      'iat': datetime.now(UTC), 'exp': datetime.now(UTC) + timedelta(minutes=10),
                      'jti': str(uuid.uuid4())}
          print(jwt.encode(payload, 'ci-only-secret-not-for-real-use', algorithm='HS256'))
          ")

          curl -sf -X POST http://localhost:8030/api/v1/markets \
            -H "Content-Type: application/json" -H "Authorization: Bearer ${TOKEN}" \
            -d '{"base_asset":"CIBTC","quote_asset":"USDT","price_precision":2,"quantity_precision":6,"tick_size":"0.01","lot_size":"0.0001","min_quantity":"0.0001","max_quantity":"50","min_notional":"5"}'

          sleep 4

          TICKER=$(curl -sf http://localhost:8030/api/v1/marketdata/CIBTC-USDT/ticker)
          echo "ticker: ${TICKER}"
          TRADE_COUNT=$(echo "${TICKER}" | python -c "import sys,json; print(json.load(sys.stdin)['trade_count_24h'])")
          if [ "${TRADE_COUNT}" -lt 1 ]; then
            echo "Expected the live simulator to have produced at least one trade by now" >&2
            cat /tmp/marketdata-ci.log
            exit 1
          fi

          CANDLES=$(curl -sf "http://localhost:8030/api/v1/marketdata/CIBTC-USDT/candles?interval=1m")
          echo "candles: ${CANDLES}"
          CANDLE_TRADE_COUNT=$(echo "${CANDLES}" | python -c "import sys,json; d=json.load(sys.stdin); print(d[0]['trade_count'] if d else 0)")
          if [ "${CANDLE_TRADE_COUNT}" != "${TRADE_COUNT}" ]; then
            echo "Candle trade_count (${CANDLE_TRADE_COUNT}) must exactly match ticker trade_count_24h (${TRADE_COUNT}) -- a mismatch means a trade was dropped or double-counted" >&2
            exit 1
          fi
      - name: Dump market-data-service log on failure
        if: failure()
        run: cat /tmp/marketdata-ci.log || true

  dependency-scan:
    name: Security / dependency scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r services/api-gateway/requirements.txt || true
          pip-audit -r services/ledger-service/requirements.txt || true
          pip-audit -r services/wallet-service/requirements.txt || true
          pip-audit -r services/market-data-service/requirements.txt || true
      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
      # `|| true` on both: report findings without hard-failing CI on every
      # transitive advisory yet -- tighten to a hard gate once a baseline
      # allowlist/triage process exists (tracked separately).

  docker-build:
    name: Docker / build validation
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, ledger-service-checks, wallet-service-checks, market-data-service-checks]
    strategy:
      matrix:
        service: [api-gateway, ledger-service, wallet-service, market-data-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve build context for ${{ matrix.service }}
        id: ctx
        run: |
          case "${{ matrix.service }}" in
            frontend) echo "path=frontend" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: false
          tags: exchange/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: exchange/${{ matrix.service }}:ci-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only until the vuln baseline is triaged; flip to "1" to hard-fail
