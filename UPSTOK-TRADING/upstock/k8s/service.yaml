# ---------------------------------------------------------------------------
# UpStok Trading -- Services
#
# postgres / redis / ledger-service / wallet-service / market-data-service
# are ClusterIP (internal only), matching how scripts/docker-run.sh only
# publishes api-gateway and frontend to the host. api-gateway and frontend
# are also ClusterIP here -- external access goes through ingress.yaml.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  labels:
    app: ledger-service
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: ledger-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  labels:
    app: wallet-service
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: wallet-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
  labels:
    app: market-data-service
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: market-data-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: upstok
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
