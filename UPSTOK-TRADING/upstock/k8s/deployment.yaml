  namespace: trading
  labels:
    app: market-data-service
    app.kubernetes.io/part-of: upstok
spec:
  replicas: 1 # background stream consumer -- scale carefully, see app docs before >1
  selector:
    matchLabels:
      app: market-data-service
  template:
    metadata:
      labels:
        app: market-data-service
    spec:
      initContainers:
        - name: migrate
