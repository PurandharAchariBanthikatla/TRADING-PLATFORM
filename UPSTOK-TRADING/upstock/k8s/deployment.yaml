            limits: { cpu: "1", memory: "512Mi" }
---
# ---------------------------------------------------------------------------
# frontend (public -- Next.js standalone server, published via Ingress)
# ---------------------------------------------------------------------------
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "frontend"
  namespace: "trading"
  labels:
    app: "frontend"
    app.kubernetes.io/part-of: upstok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "frontend"
  template:
    metadata:
      labels:
        app: "frontend"
    spec:
      containers:
        - name: "frontend"
          image: "517293881035.dkr.ecr.ap-south-1.amazonaws.com/upstok-trading:frontend"
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: upstok-config
                  key: NEXT_PUBLIC_API_BASE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      tolerations:
        - key: "name"
          operator: "Equal"
          value: "frontend_group"
          effect: "NoSchedule"
