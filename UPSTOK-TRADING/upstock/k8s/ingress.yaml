# ---------------------------------------------------------------------------
# UpStok Trading -- Ingress
#
# Routes /api/* to api-gateway (the only service that's meant to be public
# besides the frontend, per scripts/docker-run.sh) and everything else to
# the Next.js frontend. Assumes an nginx ingress controller is installed;
# swap ingressClassName / annotations if you're using a different one
# (ALB, Traefik, GKE, etc).
#
# Replace upstok.example.com with your real domain before applying, and
# make sure CORS_ORIGINS / NEXT_PUBLIC_API_BASE_URL in deployment.yaml
# match it.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upstok-ingress
  labels:
    app.kubernetes.io/part-of: upstok
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # api-gateway serves JSON, not HTML -- keep path as-is instead of
    # stripping the /api prefix.
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod # remove if not using cert-manager
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - upstok.example.com
      secretName: upstok-tls
  rules:
    - host: upstok.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
